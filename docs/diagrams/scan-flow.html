<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What happens to one photo</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #F7EDD8;   /* wheat-tint */
      --color-ink:    #121212;   /* black */
      --color-muted:  #4A4A4A;   /* charcoal */
      --color-accent: #835A1C;   /* bronze */
      --font-sans:    'Figtree', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Fasl</p>
    <h1>What happens to one photo</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 712" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fasl-scan-flow-title fasl-scan-flow-desc">
        <title id="fasl-scan-flow-title">What happens to one photo</title>
        <desc id="fasl-scan-flow-desc">Flowchart of one Fasl scan: the browser shrinks the photo and posts it to the model API, which prepares it, runs the growth-stage and health heads, and returns a crop report or a photo-unclear result.</desc>
        <defs>
<marker id="fasl-scan-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A4A4A"/></marker>
<marker id="fasl-scan-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#835A1C"/></marker>
<marker id="fasl-scan-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2F6B5E"/></marker>

        </defs>
        <rect width="100%" height="100%" fill="#F7EDD8"/>
        <g transform="translate(0,0)">

<!-- Arrows (behind nodes) -->
<line x1="480" y1="88" x2="480" y2="112" stroke="#4A4A4A" stroke-width="1.2" marker-end="url(#fasl-scan-flow-arrow)"/>
<line x1="480" y1="168" x2="480" y2="192" stroke="#4A4A4A" stroke-width="1.2" marker-end="url(#fasl-scan-flow-arrow)"/>
<line x1="480" y1="248" x2="480" y2="272" stroke="#2F6B5E" stroke-width="1.2" marker-end="url(#fasl-scan-flow-arrow-link)"/>
<line x1="480" y1="328" x2="480" y2="352" stroke="#4A4A4A" stroke-width="1.2" marker-end="url(#fasl-scan-flow-arrow)"/>
<line x1="480" y1="408" x2="480" y2="432" stroke="#4A4A4A" stroke-width="1.2" marker-end="url(#fasl-scan-flow-arrow)"/>
<line x1="600" y1="480" x2="720" y2="480" stroke="#4A4A4A" stroke-width="1.2" marker-end="url(#fasl-scan-flow-arrow)"/>
<line x1="480" y1="528" x2="480" y2="560" stroke="#835A1C" stroke-width="1.4" marker-end="url(#fasl-scan-flow-arrow-accent)"/>

<!-- Arrow labels -->
<rect x="650" y="460" width="20" height="12" rx="2" fill="#F7EDD8"/>
<text x="660" y="469" fill="#5F5546" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
<rect x="488" y="538" width="28" height="12" rx="2" fill="#F7EDD8"/>
<text x="502" y="547" fill="#835A1C" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

<!-- Nodes -->
<rect x="380" y="40" width="200" height="48" rx="20" fill="#F7EDD8"/>
<rect x="380" y="40" width="200" height="48" rx="20" fill="rgba(18,18,18,0.03)" stroke="rgba(18,18,18,0.30)" stroke-width="1"/>
<text x="480" y="62" fill="#121212" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Photo chosen</text>
<text x="480" y="78" fill="#4A4A4A" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">upload, camera or sample</text>
<rect x="380" y="112" width="200" height="56" rx="6" fill="#F7EDD8"/>
<rect x="380" y="112" width="200" height="56" rx="6" fill="#ffffff" stroke="#121212" stroke-width="1"/>
<rect x="388" y="118" width="44" height="12" rx="2" fill="none" stroke="#5F5546" stroke-opacity="0.5" stroke-width="0.8"/>
<text x="410" y="127" fill="#5F5546" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BROWSER</text>
<text x="480" y="142" fill="#121212" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Shrink the photo</text>
<text x="480" y="158" fill="#4A4A4A" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">longest side 1600px</text>
<rect x="380" y="192" width="200" height="56" rx="6" fill="#F7EDD8"/>
<rect x="380" y="192" width="200" height="56" rx="6" fill="#ffffff" stroke="#121212" stroke-width="1"/>
<rect x="388" y="198" width="28" height="12" rx="2" fill="none" stroke="#5F5546" stroke-opacity="0.5" stroke-width="0.8"/>
<text x="402" y="207" fill="#5F5546" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
<text x="480" y="222" fill="#121212" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Send to the model API</text>
<text x="480" y="238" fill="#4A4A4A" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">POST /api/predict</text>
<rect x="380" y="272" width="200" height="56" rx="6" fill="#F7EDD8"/>
<rect x="380" y="272" width="200" height="56" rx="6" fill="#ffffff" stroke="#121212" stroke-width="1"/>
<rect x="388" y="278" width="24" height="12" rx="2" fill="none" stroke="#5F5546" stroke-opacity="0.5" stroke-width="0.8"/>
<text x="400" y="287" fill="#5F5546" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
<text x="480" y="302" fill="#121212" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Prepare the image</text>
<text x="480" y="318" fill="#4A4A4A" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pad · 224px · normalise</text>
<rect x="380" y="352" width="200" height="56" rx="6" fill="#F7EDD8"/>
<rect x="380" y="352" width="200" height="56" rx="6" fill="#ffffff" stroke="#121212" stroke-width="1"/>
<rect x="388" y="358" width="36" height="12" rx="2" fill="none" stroke="#5F5546" stroke-opacity="0.5" stroke-width="0.8"/>
<text x="406" y="367" fill="#5F5546" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
<text x="480" y="382" fill="#121212" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Run both heads</text>
<text x="480" y="398" fill="#4A4A4A" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">growth stage + health</text>

<polygon points="480,432 600,480 480,528 360,480" fill="#ffffff" stroke="#121212" stroke-width="1"/>
<text x="480" y="476" fill="#121212" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Wheat, and both</text>
<text x="480" y="492" fill="#121212" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">heads 0.6 or more?</text>

<rect x="720" y="452" width="200" height="56" rx="20" fill="#F7EDD8"/>
<rect x="720" y="452" width="200" height="56" rx="20" fill="rgba(18,18,18,0.03)" stroke="rgba(18,18,18,0.30)" stroke-width="1"/>
<text x="820" y="478" fill="#121212" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Photo unclear</text>
<text x="820" y="494" fill="#4A4A4A" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">retake closer, in daylight</text>
<rect x="380" y="560" width="200" height="56" rx="20" fill="#F7EDD8"/>
<rect x="380" y="560" width="200" height="56" rx="20" fill="rgba(227,192,126,0.35)" stroke="#835A1C" stroke-width="1"/>
<text x="480" y="586" fill="#121212" font-size="12" font-weight="600" font-family="'Figtree', system-ui, sans-serif" text-anchor="middle">Crop report</text>
<text x="480" y="602" fill="#4A4A4A" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">stage · health · actions · audio</text>

<line x1="40" y1="644" x2="920" y2="644" stroke="rgba(18,18,18,0.10)" stroke-width="0.8"/>
<text x="40" y="660" fill="#4A4A4A" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="676" width="24" height="12" rx="6" fill="rgba(18,18,18,0.03)" stroke="rgba(18,18,18,0.30)" stroke-width="1"/>
<text x="72" y="686" fill="#4A4A4A" font-size="8.5" font-family="'Figtree', system-ui, sans-serif">Start / end</text>
<rect x="176" y="676" width="24" height="12" rx="2" fill="#ffffff" stroke="#121212" stroke-width="1"/>
<text x="208" y="686" fill="#4A4A4A" font-size="8.5" font-family="'Figtree', system-ui, sans-serif">Step</text>
<polygon points="276,682 288,676 300,682 288,688" fill="#ffffff" stroke="#121212" stroke-width="1"/>
<text x="308" y="686" fill="#4A4A4A" font-size="8.5" font-family="'Figtree', system-ui, sans-serif">Decision</text>
<line x1="392" y1="682" x2="416" y2="682" stroke="#835A1C" stroke-width="1.2" marker-end="url(#fasl-scan-flow-arrow-accent)"/>
<text x="424" y="686" fill="#4A4A4A" font-size="8.5" font-family="'Figtree', system-ui, sans-serif">Happy path</text>
<line x1="520" y1="682" x2="544" y2="682" stroke="#2F6B5E" stroke-width="1.2" marker-end="url(#fasl-scan-flow-arrow-link)"/>
<text x="552" y="686" fill="#4A4A4A" font-size="8.5" font-family="'Figtree', system-ui, sans-serif">HTTP request</text>
<line x1="660" y1="682" x2="684" y2="682" stroke="#4A4A4A" stroke-width="1.2" marker-end="url(#fasl-scan-flow-arrow)"/>
<text x="692" y="686" fill="#4A4A4A" font-size="8.5" font-family="'Figtree', system-ui, sans-serif">Next step / branch</text>

        </g>
      </svg>
    </div>
  </div>
</body>
</html>
